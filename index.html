<!doctype html>

    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --text-dark: #3d1635;
        --text-mid: #6b3d5e;
        --text-accent: #7a2348;

        /* Ці значення JS перезапише у px одразу після завантаження */
        --card-w: 1200px;
        --card-pad: 60px 80px;
        --card-radius: 40px;
        --title-size: 100px;
        --subline-size: 28px;
        --tag-size: 18px;
        --num-size: 180px;
        --lbl-size: 20px;
        --grid-gap: 24px;
        --cell-pad: 32px 12px;
        --cell-radius: 28px;
        --sun-size: 300px;
        --mb-title: 16px;
        --mb-tag: 24px;
        --mb-sub: 60px;
        --mb-num: 12px;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Manrope", system-ui, sans-serif;
        background: linear-gradient(
          135deg,
          #ffd6e7 0%,
          #f9c2e0 20%,
          #e8b8f0 38%,
          #d8b4fe 55%,
          #bfd8ff 75%,
          #c5f0dc 100%
        );
        background-size: 200% 200%;
        animation: bgShift 20s ease-in-out infinite;
        color: var(--text-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        position: relative;
      }

      @keyframes bgShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .bg-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
      }

      .sun {
        position: absolute;
        top: 40px;
        right: 60px;
        width: var(--sun-size);
        height: var(--sun-size);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #fff8c8 0%,
          #ffd86b 50%,
          rgba(255, 216, 107, 0) 100%
        );
        filter: blur(2px);
        animation: sunPulse 6s ease-in-out infinite;
      }

      @keyframes sunPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.95;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }

      .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.55);
        border-radius: 100px;
        filter: blur(8px);
        animation: drift linear infinite;
      }

      /* Анімації використовують великі фіксовані px, щоб працювати на будь-якому екрані */
      @keyframes drift {
        0% {
          transform: translateX(-400px);
        }
        100% {
          transform: translateX(5000px);
        }
      }

      .petal {
        position: absolute;
        top: -60px;
        animation: fall linear infinite;
        will-change: transform;
      }

      @keyframes fall {
        0% {
          transform: translateY(-80px) translateX(0) rotate(0deg);
          opacity: 0;
        }
        8% {
          opacity: 0.9;
        }
        92% {
          opacity: 0.9;
        }
        100% {
          transform: translateY(3000px) translateX(250px) rotate(720deg);
          opacity: 0;
        }
      }

      .butterfly {
        position: absolute;
        animation: fly linear infinite;
        will-change: transform;
      }

      @keyframes fly {
        0% {
          transform: translate(-120px, 0) rotate(-4deg);
        }
        25% {
          transform: translate(1400px, -120px) rotate(6deg);
        }
        50% {
          transform: translate(2800px, 60px) rotate(-4deg);
        }
        75% {
          transform: translate(4200px, -90px) rotate(6deg);
        }
        100% {
          transform: translate(5600px, 0) rotate(-4deg);
        }
      }

      .wing {
        transform-origin: center;
        animation: flap 0.32s ease-in-out infinite;
      }

      @keyframes flap {
        0%,
        100% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(0.25);
        }
      }

      .glass {
        position: relative;
        z-index: 10;
        width: var(--card-w);
        padding: var(--card-pad);
        background: rgba(255, 255, 255, 0.32);
        backdrop-filter: blur(32px) saturate(180%);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        border: 2px solid rgba(255, 255, 255, 0.7);
        border-radius: var(--card-radius);
        box-shadow:
          0 30px 100px rgba(160, 80, 140, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
        text-align: center;
      }

      .tag {
        display: inline-block;
        font-family: "Manrope", sans-serif;
        font-size: var(--tag-size);
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-accent);
        background: rgba(255, 255, 255, 0.6);
        padding: 0.6em 1.6em;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.75);
        margin-bottom: var(--mb-tag);
      }

      .title {
        font-family: "Fraunces", "Times New Roman", serif;
        font-variation-settings:
          "opsz" 144,
          "SOFT" 50;
        font-size: var(--title-size);
        font-weight: 500;
        line-height: 1;
        color: var(--text-dark);
        margin-bottom: var(--mb-title);
        letter-spacing: -0.02em;
      }

      .title em {
        font-style: italic;
        font-weight: 400;
        color: var(--text-accent);
      }

      .subline {
        font-family: "Fraunces", "Times New Roman", serif;
        font-style: italic;
        font-size: var(--subline-size);
        color: var(--text-mid);
        margin-bottom: var(--mb-sub);
        font-weight: 400;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--grid-gap);
      }

      .cell {
        background: rgba(255, 255, 255, 0.5);
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: var(--cell-radius);
        padding: var(--cell-pad);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: transform 0.4s ease;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .num {
        font-family: "Fraunces", "Times New Roman", serif;
        font-variation-settings: "opsz" 144;
        font-size: var(--num-size);
        font-weight: 500;
        line-height: 0.95;
        color: var(--text-dark);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
        margin-bottom: var(--mb-num);
      }

      .lbl {
        font-family: "Manrope", sans-serif;
        font-size: var(--lbl-size);
        color: var(--text-mid);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-weight: 600;
      }

      .pulse {
        animation: pulse 0.6s ease;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }

      .done .title {
        color: var(--text-accent);
      }
    </style>
  </head>

    <script>
      // ==========================================================
      //  НАЛАШТУВАННЯ: змініть дату і час тут
      // ==========================================================
      var TARGET = new Date("2026-04-24T15:25:00").getTime();

      // ==========================================================
      //  Обчислення всіх розмірів у ПІКСЕЛЯХ на основі розміру вікна
      //  Виконується під час завантаження та при зміні розміру вікна
      // ==========================================================
      function applyPixelSizes() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var r = document.documentElement.style;

        // Якщо монітор надто маленький — використовуємо мобільну розкладку
        var isMobile = w < 900;

        if (isMobile) {
          r.setProperty("--card-w", Math.round(w * 0.94) + "px");
          r.setProperty(
            "--card-pad",
            Math.round(h * 0.04) + "px " + Math.round(w * 0.05) + "px",
          );
          r.setProperty("--card-radius", "24px");
          r.setProperty("--title-size", Math.round(w * 0.14) + "px");
          r.setProperty("--subline-size", Math.round(w * 0.04) + "px");
          r.setProperty("--tag-size", "12px");
          r.setProperty("--num-size", Math.round(w * 0.18) + "px");
          r.setProperty("--lbl-size", Math.round(w * 0.028) + "px");
          r.setProperty("--grid-gap", Math.round(w * 0.02) + "px");
          r.setProperty(
            "--cell-pad",
            Math.round(h * 0.025) + "px " + Math.round(w * 0.01) + "px",
          );
          r.setProperty("--cell-radius", "18px");
          r.setProperty("--sun-size", Math.round(w * 0.25) + "px");
          r.setProperty("--mb-title", Math.round(h * 0.01) + "px");
          r.setProperty("--mb-tag", Math.round(h * 0.015) + "px");
          r.setProperty("--mb-sub", Math.round(h * 0.03) + "px");
          r.setProperty("--mb-num", "6px");
        } else {
          // Великі монітори: всі розміри — 100% у пікселях, обчислені з поточного розміру
          r.setProperty("--card-w", Math.round(w * 0.92) + "px");
          r.setProperty(
            "--card-pad",
            Math.round(h * 0.06) + "px " + Math.round(w * 0.04) + "px",
          );
          r.setProperty("--card-radius", Math.round(w * 0.025) + "px");
          r.setProperty("--title-size", Math.round(w * 0.09) + "px");
          r.setProperty("--subline-size", Math.round(w * 0.02) + "px");
          r.setProperty("--tag-size", Math.round(w * 0.013) + "px");
          r.setProperty("--num-size", Math.round(w * 0.15) + "px");
          r.setProperty("--lbl-size", Math.round(w * 0.014) + "px");
          r.setProperty("--grid-gap", Math.round(w * 0.015) + "px");
          r.setProperty(
            "--cell-pad",
            Math.round(h * 0.03) + "px " + Math.round(w * 0.01) + "px",
          );
          r.setProperty("--cell-radius", Math.round(w * 0.02) + "px");
          r.setProperty(
            "--sun-size",
            Math.min(Math.round(w * 0.18), 400) + "px",
          );
          r.setProperty("--mb-title", Math.round(h * 0.015) + "px");
          r.setProperty("--mb-tag", Math.round(h * 0.02) + "px");
          r.setProperty("--mb-sub", Math.round(h * 0.05) + "px");
          r.setProperty("--mb-num", Math.round(h * 0.01) + "px");
        }
      }

      applyPixelSizes();
      window.addEventListener("resize", applyPixelSizes);

      // ==========================================================
      //  Відлік часу
      // ==========================================================
      function byId(id) {
        return document.getElementById(id);
      }
      function pad(n) {
        return (n < 10 ? "0" : "") + n;
      }

      function setNum(id, val) {
        var el = byId(id);
        var s = pad(val);
        if (el.textContent !== s) {
          el.textContent = s;
          var cell = el.parentNode;
          cell.classList.remove("pulse");
          void cell.offsetWidth;
          cell.classList.add("pulse");
        }
      }

      function tick() {
        var now = Date.now();
        var diff = TARGET - now;
        if (diff < 0) diff = 0;

        var d = Math.floor(diff / 86400000);
        var h = Math.floor(diff / 3600000) % 24;
        var m = Math.floor(diff / 60000) % 60;
        var s = Math.floor(diff / 1000) % 60;

        setNum("days", d);
        setNum("hours", h);
        setNum("minutes", m);
        setNum("seconds", s);

        var sub = byId("subline");
        if (d <= 0 && h <= 0 && m <= 0 && s <= 0) {
          sub.textContent = "🎉 Канікули почалися! Гарного відпочинку!";
          byId("board").classList.add("done");
        } else if (d < 1 && h < 1) {
          sub.textContent = "Залишилися лічені хвилини! 🌷";
        } else if (d < 1) {
          sub.textContent = "Залишилися лічені години! 🌸";
        } else if (d < 7) {
          sub.textContent = "Фінальний тиждень 🌺";
        }
      }

      tick();
      setInterval(tick, 1000);

      // Подвійний клік — повноекранний режим
      document.body.addEventListener("dblclick", function () {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
          }
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      });
    </script>
  </body>
</html>
